# Operation Love v2 — configuration (no hardcoded paths/coords; everything lives here)

# Which platform to run. See operation_love/platforms.py for the registry.
#
# Hinge and Bumble use the same physical Pixel, so only one can run at a time. The registry
# rejects a combined selection and the supervisor holds an exclusive device lock.
#
#   hinge      — app-based, calibrated, the working path
#   bumble     — app-based, uncalibrated; both modes fail closed
enabled_apps: [hinge]

# training = the Hub makes every Like/Dislike decision after the bot has prepared a
#            targeted typed opener. Each verified choice is stored as a training label.
# auto     = the bot swipes for you using the model it learned.
mode: training              # training (Hub-only) | auto

# Per-app options.
apps:
  bumble:
    # Both Bumble modes remain unavailable until live calibration is completed and the
    # required paid-upsell detection template exists.
    serial: "33111JEHN04475"    # same physical Pixel as Hinge; fill in adb_path below if adb isn't on PATH
    adb_path: adb
    touch_backend: auto
    package: com.bumble.app
    debug_log: true
    debug_dir: ./data/bumble_android_debug
    halt_on_error: true
    coords:
      # If Auto is calibrated later, it must decide only by dragging the card body. The live
      # deck places Compliment at lower-left and paid SuperSwipe at lower-right; neither is a
      # decision target. These endpoints remain placeholders and Auto is mode-gated off.
      swipe_start: [0.50, 0.55]
      swipe_like_end: [0.92, 0.52]
      swipe_pass_end: [0.08, 0.52]
  hinge:
    # Physical Pixel over HOST-SIDE ADB only — no uiautomator2 / on-device helper
    # (ops/HINGE-PIXEL-RUNBOOK.md). Taps/swipes are humanized motionevent gestures.
    serial: "33111JEHN04475"  # adb device serial (Pixel 7a); empty = first available. `adb devices`
    adb_path: adb           # path to the adb binary
    # auto | uhid = REQUIRE the genuine UHID touchscreen (variable pressure, real FINGER
    # events); the run fails loudly if it is unavailable rather than quietly downgrading.
    # adb = deliberately accept the degraded input transport (humanized paths, but constant
    # pressure). There is no silent fallback: choosing the weaker signature is an explicit act.
    # uhid_persistent = the SAME genuine UHID touches as uhid, delivered through ONE
    # virtual device held open for the whole session (operation_love/drivers/uhid.py's
    # PersistentUhidTouch) instead of re-registered per gesture.
    #
    # SHIPPED AS THE DEFAULT 2026-08-28, on measurement, after the supervised review this
    # entry previously said it was waiting for. Two live A/Bs on the connected Pixel 7a:
    #   * isolated transport bench, 20 gestures each, page movement checked per gesture with
    #     the production frameshift estimator: 2.605s -> 0.592s per gesture (77% faster),
    #     20/20 landed on BOTH transports, delivered distance identical (mean 259px, range
    #     257-261 either way), so the motion is unchanged and only delivery differs.
    #   * same real profile read end to end via the production next_profile(), K=3 both
    #     times: 284s -> 200s wall (30% faster), of which gesture time 118s -> 35s. The
    #     saving IS the transport: 83s of the 84s.
    # 143 gestures across those runs, zero non-delivery. The residual gap below is unchanged
    # and still accepted; what changed is that the speed claim is now measured through the
    # real driver rather than inferred from a 9-gesture sample.
    #
    # LIVE-VERIFY: what WAS validated live: the persistent `adb shell -tt
    # "hid /proc/self/fd/0"` mechanism survives across multiple gestures with no
    # re-registration, a real read-scroll against live Hinge landed correctly
    # (screenshot-confirmed), a full 9-gesture read completed correctly through the real
    # driver, and `proc.kill()` alone tears the virtual device down cleanly (4/4 live
    # kills, `/proc/bus/input/devices` confirmed empty after). What was NOT independently
    # proven, and is not fixable without a larger redesign of the confirmation protocol
    # itself: a remote mid-session crash being noticed on the host side rests on an
    # INFERENCE (the process still appears alive after a host-side wait), not the genuine
    # blocking round-trip confirmation the per-gesture `uhid` transport gets for free — see
    # PersistentUhidTouch's own docstring for the full reasoning and the adversarial review
    # that found this. Watch real unattended runs for a gesture that silently doesn't land;
    # `touch_backend: uhid` is the instant revert to the fully-proven per-gesture transport.
    #
    # WHY THE RESIDUAL IS TOLERABLE HERE, restated 2026-08-28 so the next reader does not have
    # to re-derive it: a silently-dropped gesture cannot produce a wrong action, only a refused
    # one, because the navigator measures EVERY reverse gesture's actual page movement.
    # item_nav.py:1502 computes `climb_px` from the frameshift estimator and hands it to
    # `step_overshoot`; `climb_px <= 0` -- "the profile did not move", which is exactly what a
    # dropped gesture looks like -- raises ItemNavigationError(NAV_SCROLL_STALLED) at
    # item_nav.py:1531, before any tap. `verify_sheet_item` then independently re-proves the
    # selected card at the sheet. The transport's blocking round trip was defence-in-depth over
    # those two content checks, not the only line -- which is what makes trading it for 30% of
    # every profile's wall clock reasonable.
    #
    # NOT the justification, though an earlier draft of this comment wrongly said so:
    # `agreement_px` is REPORTED, not enforced. It is the worst count-vs-index disagreement
    # (item_nav.py:1431), consumed only by a debug log line in hinge.py; `_count_disagrees`
    # passes anything within its 16px tolerance, so a nonzero value does not refuse. The
    # separate `disagreement` return is what raises NAV_COUNT_DISAGREES. Do not cite
    # agreement_px as a safety gate.
    touch_backend: uhid_persistent
    # 2026-08-10: raised 8 -> 12 after a bug report traced a false legacy-observation PASS partly to
    # this ceiling — 2 of the last 3 profiles in that run hit exactly 8 captures (the old
    # value), meaning the automated read hadn't reached the true bottom before the owner
    # started reading manually, so nothing captured could match what they scrolled into (see
    # wait_for_decision's _vertical_shift_match, which can only recognize a scroll into
    # territory the bot already captured). LIVE-VERIFY: unverified on-device at 12 — watch the
    # first few Training runs for materially longer per-profile capture time before trusting it
    # unattended, same as any other geometry/behavior value in this file.
    scroll_captures: 12     # max screencaps while reading one profile
    # How many cards the still-photo dwell proves per capture. The read itself only ever leaves
    # the phone parked on ONE card, and only a parked, centred card can be proved (Hinge autoplays
    # a video near screen centre and nowhere else), so before 2026-08-23 at most one item on a
    # profile could ever be numbered no matter how many the model was shown -- measured live at
    # 15 cards indexed, 0 numbered (ops/STILL-PHOTO-DISCRIMINATOR.md 5d). Above 1, the dwell
    # spends the remaining budget on extra navigation hops per capture, nearest the read's end
    # first, proving each parked card and returning to the entry before the next hop. A cheap
    # crop/type pre-pass removes written, unknown, and already-excluded video cards from that
    # pool before any proof gesture or dwell is spent; every retained photo still has to pass the
    # complete still-media proof, so this saves time without weakening acceptance.
    #
    # THIS COSTS REAL GESTURES AND REAL DEVICE TIME, AND THE COST IS NOT LINEAR IN K. The walk
    # cannot chain -- navigate_to_item is ascending-only and always anchors on the read's last
    # frame -- so every hop climbs from the entry AGAIN and the distance grows with each card.
    # Modelled 2026-08-23 from the code's own constants against 125 measured enumeration reads
    # (median read: 227s, 36 frames): the 1st extra card costs ~27-63s, the 2nd ~46-89s, the 3rd
    # ~69-116s, the 8th ~190-284s. Per-profile capture, read included: K=1 ~4.0-4.5 min, K=3
    # ~5.2-7.1 min, K=5 ~7.8-11.4 min, K=8 ~14.5-21.8 min. The earlier note here said "15-30s per
    # extra card" flat -- that was right for the first card only and understated every one after.
    #
    # K SATURATES AT THE CARD COUNT: a real profile carries ~9 selectable cards (median over 122
    # live manifests), so K=10 and K=15 buy nothing over K=9.
    #
    # Set it to 1 to get the pre-2026-08-23 behaviour back exactly -- every refusal in the walk
    # already abandons only the WALK, never the capture, so 1 is also what the worst case
    # degrades to on its own. LIVE-VERIFY: run f8bc1d2969d1 (2026-08-30) completed 11 K=3
    # captures with exactly three numbered candidates each and no dwell-walk refusal; candidates
    # beyond K remain intentionally uncovered. The largest remaining uncertainty is how often a
    # hop is attempted at all.
    still_photo_dwell_candidates: 3
    dwell_s: 1.1            # per-card read dwell, humanized (Signals #1: read before deciding)
    read_scroll_frac: 0.55  # how far each read-scroll advances the profile
    # Return navigation is intentionally longer than a read step: a single manual Hinge flick
    # can travel from a deeply read card to its top. The driver still confirms the filter-chip
    # header after every stroke and falls back to its bounded retry loop if this does not land.
    rewind_scroll_frac: 0.78
    change_threshold: 9.0   # mean grayscale delta (0..255, 24x24) to call a frame region "changed"
    # Host debug log: data/hinge_debug/<run>/ = actions.jsonl + screenshots. AUTO retains an
    # `auto_opener_pre_send` frame after typing the opener on its selected item and before Send.
    debug_log: true
    debug_dir: ./data/hinge_debug
    # How many RUN DIRECTORIES under debug_dir to keep. The per-run screenshot caps have always
    # been bounded; the NUMBER OF RUNS never was, and by 2026-08-28 data/hinge_debug held 274
    # runs / 12GB. Pruning happens at run start, keeps the newest N by mtime, and only ever
    # considers immediate subdirectories that contain an actions.jsonl (i.e. runs this logger
    # itself wrote) and are not the run being written. Delete this key or set it to null to keep
    # every run forever, which is the pre-2026-08-28 behaviour.
    # NOTE: at 50, the FIRST run after this lands prunes ~224 existing run directories (~10GB).
    # Raise it, or comment it out, if you want that history kept.
    debug_keep_runs: 50
    # Run directories cited from OUTSIDE data/hinge_debug, which retention must never delete no
    # matter how old they get -- age is a terrible proxy for value here. The release-evidence run
    # is NOT listed: it is derived from observe_release_evidence.production_run_id below, so the
    # two cannot drift apart. These are the rest:
    debug_protect_runs:
      - 312b80bf4b50    # ops/release/312b80bf4b50/ holds this run's signed release artifacts
      - e7b13ac6fd21    # frames cited as fixture provenance by tests/test_hinge_out_of_likes.py
      - a01fbcd1e9a0    # actions.jsonl cited as evidence_ref by tests/test_label_retractions.py
      # Listed after the fact: BOTH of these were destroyed by the first retention pass on
      # 2026-08-28, before debug_protect_runs existed. Their tests skip gracefully when the data
      # is absent (it was always machine-local, never a CI fixture), so nothing is red -- but two
      # real replays over real Hinge pixels are gone and cannot be regenerated. They stay listed
      # so a future run reusing either id is never pruned, and as the reason the guard test in
      # tests/test_hinge_debuglog.py exists.
      - run_20260811_011416   # LOST: historical observe log, tests/test_hinge_observe_release.py
      - run_20260821_163736   # LOST: 2026-08-21 video replay, tests/test_hinge_video_bound_auto.py
      # The ONLY two frames in the whole corpus showing a pillarboxed selected preview (a portrait
      # photo centred in its card), swept 2026-08-28 over 98 runs / 297 verify sheets. They are the
      # same profile met twice and they are the entire evidence base for
      # item_verify._INLINE_PILLARBOX_MIN_WIDTH_FRACTION and the regime around it -- n = 1 render,
      # so losing either leaves a shipped safety path with nothing behind it.
      - f6a15d162e68   # 2026-08-28 halt; frames cited as provenance by tests/test_item_verify.py
      - d605b0837ac2   # 2026-08-27 halt, the same card and the same refusal, one day earlier
      # The two halves of the Hinge 10.1.0 PINNED-HEADER evidence, and they are only evidence
      # together: one shows the defect, the other shows the state where it does not occur. Losing
      # either leaves the rule with no negative control. Neither can be regenerated — the app
      # state that produced them is not reproducible on demand (what selects the expanded vs the
      # collapsed header is still unknown, see ops/OPENER-REDESIGN.md addendum 2026-08-28).
      - 8fb11094ef4d   # 2026-08-28 index refusal; the six frames whose rows 300..516 are
                       #   byte-identical across 2305px of scroll — the whole basis for
                       #   segment._unanchored_leading_island_rows and for the measured 968-of-974
                       #   span margin that its clause (c) turns on
      - 78d364c5527d   # the SAME day and build with NO pinned strip intersecting the band: the
                       #   negative control proving the rule is per-screen-state, not blanket
      - 5d79a2d45bfa   # 2026-08-30 Allison low-contrast gutter incident; frames 7..10 are the
                       #   real-pixel replay for segment._restore_low_contrast_card_surface_at_strict_gutter
    halt_on_error: true     # auto mode STOPS on any unexpected error (no restart) so debug logs are preserved
    # Action points as FRACTIONS of the screen (x, y in 0..1). Calibrated live on the Pixel 7a
    # (1080x2400) 2026-06-27. like_heart / pass_x are located by VISION at runtime (template-
    # matching the glyph) because the "Start sending likes" banner + per-profile photo heights
    # shift the heart, and the X's disc merges into white prompt backgrounds; these fractions
    # are only the FALLBACK used when vision can't find the glyph. The inline comment and Send
    # Like controls have no configured coordinates: both are structurally located afresh.
    coords:
      like_heart: [0.868, 0.667]  # FALLBACK only — heart is vision-located on the first photo
      pass_x: [0.116, 0.848]      # FALLBACK only — X is vision-located (floating, bottom-left)
    # --- legacy passive-observer/internal-calibration decision detection -------------------
    # The OLD rule ("top region changed and no captured frame matches -> PASS") recorded a
    # PASS off of nothing but a manual scroll -- reported twice by the owner. These five keys
    # are what replace it: an identity anchor (layer 1, authoritative), a tighter content-only
    # scroll match (layer 2), and read-only gesture corroboration off the phone's own touch
    # stream (layer 3). See operation_love/drivers/hinge.py's HINGE_SPEC comment block and
    # wait_for_decision's docstring for the full reasoning; every geometry value below is
    # config-overridable the same way coords/change_threshold above are.
    #
    # LIVE-VERIFY: identity_band/content_band/observe_ignore_zones were measured live on the
    # Pixel 7a (1080x2400) 2026-08-10 (see HINGE_SPEC's own comments for the exact numbers and
    # the measured separation table) but, like every geometry value in this file, should be
    # re-confirmed if Hinge ships a UI update that moves the sticky header, the filter-chips
    # row, or the floating deck controls.
    identity_band: [0.10, 0.048, 0.80, 0.094]   # Hinge's sticky per-profile name header
    # A targeted-opener calibration, when added, must record these exact effective
    # identity_band/content_band values with its bounds and exact ADB serial. See RUNBOOK.
    # Card-header name band, consulted only when the identity_band verdict above is exactly
    # "top" (scroll-top, where identity_band shows profile-independent filter chips instead of
    # a name -- see android_spec.py's identity_top_name_band docstring for the full mechanism
    # and the bug this fixes: a pass that advanced Zorva -> Qelix got recorded as a scroll of
    # Zorva because nothing on screen could name the new card). OCR-only, never a pixel
    # signature -- MEASURED on real Pixel 7a frames on 2026-08-10 by OCR'ing (tesseract --psm 6)
    # the actual failing run's screenshots. Reads (all correct):
    #   Zorva, scroll-top, with the purple "shows thoughtful signals" banner -> "Zorva %"
    #   Zorva, scroll-top, banner gone (content shifted up)   -> "Zorva @ | @ Signals Active today"
    #   Qelix, scroll-top, with banner (three separate frames) -> "Qelix &"
    # PINNED-HEADER INCIDENT (2026-08-28): the prior claim that this OCR band is garbage when
    # scrolled was false. Six frames 2305px apart had a byte-identical pinned header through
    # row 516, including this band, so a name alone is never evidence of which card is visible.
    # The matching identity band also falsely reported scroll top at distance 0.000.
    #
    # A same-build live follow-up corrected the initial "recalibrate the rect" conclusion:
    # normal scrolling collapses the toolbar, and identity_band measured 0.000 only at top and
    # 12.547..12.797 on every scrolled frame. No geometry value changed. Instead,
    # scroll_top.band_pinned_evidence detects a proven screen-fixed header across different
    # offsets and forces the verdict to check_unavailable; item identity then fails closed.
    # Re-measure the identity and chips bands together only after a future Hinge UI change.
    # See ops/ANTI-BOT-RESEARCH.md's 2026-08-28 addenda for the evidence and correction.
    identity_top_name_band: [0.03, 0.130, 0.75, 0.250]
    identity_top_name_fallback_band: [0.03, 0.130, 0.75, 0.235]
    content_band: [0.125, 0.875]                # scrolling content only, excludes fixed chrome
    observe_ignore_zones:
      - [0.75, 0.030, 1.00, 0.115]   # rewind arrow + "..." overflow, top-right
      - [0.00, 0.900, 1.00, 1.000]   # bottom nav bar
    # Read the phone's own touch event stream (host-side `adb shell getevent`, READ-ONLY --
    # see operation_love/drivers/touchwatch.py) to corroborate an identity-proven card advance
    # with actual tap evidence before calling it a PASS.
    #
    # FALSE because it does not work on THIS phone. Measured 2026-08-10 on the Pixel 7a running
    # Android 17 (SDK 37): the adb shell user is in group 1004(input) and `getevent -p
    # /dev/input/event3` reads the touchscreen's capabilities fine, but 30s of deliberate
    # tapping and scrolling produced ZERO lines -- Android withholds the input stream from
    # unprivileged readers on this build. Not recoverable in code; see HINGE_SPEC's comment.
    # With this extra layer unavailable, a pixel-only identity change is never enough for PASS:
    # the different card-header name must reproduce cleanly on both settled frames, otherwise
    # the legacy observer resyncs without a label. Flip to true only on a device where
    # `python -m tools.touch_selftest` actually prints TAP/DRAG lines while you touch.
    observe_touch_watch: false
    # OCR (via the host's `tesseract` binary, if installed) of the identity/card-header bands.
    # A matching name safely vetoes a transient pixel mismatch; a different name at scroll top
    # must reproduce on two frames before PASS. OCR is never sufficient to write a label and is
    # never persisted to the label store, but disabling it can leave real scroll-top advances
    # unresolved on this device because touch watching is unavailable. Keep true here.
    observe_name_ocr: true
    # NUMBERING LICENSED BY AN ACCEPTED, UNMEASURED ASSUMPTION (owner decision 2026-08-21).
    #
    # This is NOT a measured bound. Nothing here reports a video false-accept rate, because
    # none was measured. See ops/STILL-PHOTO-DISCRIMINATOR.md section 5b for the full record.
    # Every run states this in the operator log and on the hub.
    # To replace it with real evidence later, collect a corpus with tools/hinge_video_bound
    # (owner labeled) or tools/hinge_video_bound_auto (circular), then swap this block for
    # `still_photo_bound_evidence`. The two keys are mutually exclusive by design.
    # TARGETING CALIBRATION — renewed 2026-08-26 on the live Hinge 10.1.0 build.
    #
    # Emitted by `tools.hinge_calibrate measure` from two separately collected calibration
    # profiles and three held-out profiles, with every permanent action approved at a hash-bound
    # reviewer checkpoint. Strategy `photo_1_only_v1` — item 1 on every ordinal — so this
    # calibration does NOT exercise deep-item navigation; the manifests record that and
    # `measure` refuses to mix strategies.
    #
    # Exact bounds and replay results are in
    # ops/calibration/targeting_20260826T_terra_calibration_v3/measurement_ledger.json. Both
    # numeric gates passed with zero foreign accepts and zero false refusals. The inline bound
    # remains capped by the tighter prior-corpus foreign-match limit.
    #
    # This is AUTOMATED CIRCULAR-RISK evidence: AI-reviewed, `human_ground_truth: false`. It
    # licenses numbered targeted suggestions for Training on the exact 10.1.0 build. It does NOT
    # release AUTO; the production-observe artifact below remains historical 10.0.1 evidence.
    targeting_calibration:
      schema_version: 3
      device: "33111JEHN04475"
      hinge_version_name: "10.1.0"
      frame_size_px: [1080, 2400]
      composer_layout_id: hinge_inline_v1
      item_selection_policy_id: hinge_photos_only_v2
      identity_match_max_dist: 0.8852
      inline_item_max_dist: 14.9099
      calibrated_at: "2026-08-26T20:17:22.600335+00:00 — measured from session(s): targeting_20260826T_terra_calibration_v2, targeting_20260826T_terra_calibration_v3, targeting_20260826T_terra_heldout, targeting_20260826T_terra_heldout_b, targeting_20260826T_terra_heldout_c"
      identity_band: [0.1, 0.048, 0.8, 0.094]
      content_band: [0.125, 0.875]
    still_photo_assumption_acceptance:
      acceptance: I_ACCEPT_UNMEASURED_CENTERED_AUTOPLAY_ASSUMPTION
      accepted_at: "2026-08-26 owner-directed live calibration renewal for Hinge 10.1.0"
      device: "33111JEHN04475"
      hinge_version_name: "10.1.0"
      rationale: >-
        Measuring the held-out video false-accept rate needs roughly 420 profiles and 420 real
        passes at the observed rate of one video per seven profiles, which the owner judged
        disproportionate. Hinge autoplays a card only at screen center and nothing else on a
        profile changes pixels over time, so a centered video is playing and a playing video is
        detectable by the byte-exactness test. Accepted residual: a video that is not playing at
        all while observed, meaning stalled, buffering, unloaded, or an ended non-looping clip.
        The re-attach probe gives such a card a second trigger before anything is called a photo.
    # HISTORICAL MANUAL AUTO RELEASE (2026-08-25): this exact legacy production artifact binds
    # the historical 10.0.1 calibration to run d8547ff144b4. The phone is now on 10.1.0, so
    # neither this mapping nor the calibration above licenses the live build. Keep both as an
    # immutable audit record; recapture schema-v3 calibration for 10.1.0 and earn fresh release
    # evidence before AUTO. The still-photo assumption remains explicitly UNMEASURED and cannot
    # by itself authorize AUTO.
    observe_release_evidence:
      schema_version: 1
      calibration_calibrated_at: "2026-08-22T23:50:45.216285+00:00 — measured from session(s): targeting_20260822T_calA, targeting_20260822T_heldB"
      calibration_sha256: d6a2a3b4ccb8464f101ae074c247b5bec709462fe87bda41e237453d85dee2ac
      device: "33111JEHN04475"
      hinge_version_name: "10.0.1"
      frame_size_px: [1080, 2400]
      production_run_reference: data/hinge_debug/d8547ff144b4
      production_run_id: d8547ff144b4
      verification_file: ops/release/d8547ff144b4/manual-release/hinge_observe_release.json
      verification_sha256: 95e4f6f7b079e7fbcecca86ceeb480eca129ddaac4ec174d9bc013b3d6255d8c
      verified_at: "2026-08-25T05:57:05.701897+00:00"
paths:
  data_dir: ./data
  db_file: ./data/operation_love.db        # used only when storage.backend = sqlite

# --- Storage (system-of-record) ---
storage:
  backend: bigquery            # bigquery | sqlite
  bigquery:
    project_id: operation-love-2026   # dedicated GCP project (billing-linked; BQ API on)
    dataset: operation_love
    location: US
    photo_bucket: operation-love-2026-profile-photos
    # Buffer N rows before streaming to BigQuery (low = less seed data lost on a crash/kill).
    # 1, not 5: a Training session produces 3-20 labels in total, so batching buys nothing
    # measurable, while at 5 a whole session's labels can sit in process memory until the
    # shutdown flush. Measured on the run of 2026-08-10: 3 labels, none of them written until
    # the run ended. The photos DO go to GCS immediately inside record_profile, so a hub
    # force-quit in that window left orphan photo objects in the bucket with no labels
    # pointing at them — the worst of both outcomes.
    #
    # Accepted trade: a row BigQuery rejects now halts the run on the spot (the insert error
    # is raised by the flush, and the worker's halt-on-unexpected handler stops the run and
    # shows it on the hub) instead of surfacing at shutdown. That is the wanted behaviour —
    # a store that is rejecting writes should stop you an hour of manual labelling early, not
    # after — but it does mean one bad row ends the session rather than the save.
    flush_every: 1

# --- Decision engine (local, learns YOUR taste from YOUR swipes) ---
ranker:
  like_threshold: 0.5          # P(like) above which we like
  min_labels_to_engage: 40     # ranker stays "not ready" until this many labels (needs both like+pass)
  retrain_every: 1             # training mode: retrain live after each new label
  min_per_class: 5             # each class (like/pass) needs at least this many examples to train

quality_filter:
  enabled: true
  metric: clipiqa              # pyiqa metric; drops blurry/low-quality photos
  min_score: 0.30

# --- Opener (Gemini free tier, with ordered fallback) ---
opener:
  enabled: true
  provider: gemini
  # `model` remains supported for legacy single-model configurations. New Gemini runs
  # try `models` in order when a free-tier model has no capacity.
  model: gemini-3.6-flash
  # QUALITY-DESCENDING cascade, EMPIRICALLY VERIFIED live against the real Gemini API with
  # this project's exact request shape (inline image + responseJsonSchema + thinkingConfig)
  # -- every one of these seven returned a valid opener when probed directly. Free-tier
  # daily capacity (RPD = requests/day) is roughly: 20 RPD each for the three Flash models
  # (gemini-3.6-flash, gemini-3.5-flash, gemini-3-flash-preview), 500 RPD each for the two
  # Flash Lite models, and 14,400 RPD each for the two Gemma models below -- about
  # 29,900 requests/day of TOTAL capacity across the cascade, vastly more than a
  # human-paced bot can burn through in a session. An entry is dropped for the REST OF THIS
  # RUN ONLY the first time it either (a) returns a per-DAY quota 429 (RPD resets at
  # midnight Pacific), or (b) returns HTTP 404 NOT_FOUND, meaning the model id has been
  # retired / is no longer available to this account -- MEASURED directly: gemini-2.5-flash
  # and gemini-2.5-flash-lite were both still listed by ListModels with generateContent
  # support, yet 404d on every real generateContent call, which is why they were removed
  # from this list entirely rather than kept as a hopeful fallback. A per-MINUTE 429 is
  # transient and does NOT drop the model (see GeminiOpener.generate). gemini-3-flash-preview
  # is a preview id, which Google can retire without notice -- that risk is now acceptable
  # to take because a 404 on any ONE model only retires that model from the cascade for the
  # rest of the run; it no longer takes the other six down with it (see opener/opener.py's
  # generate() 404 handling and opener/service.py's _permanent_reason docstring). The two
  # Gemma models sit last because they are smaller open models rather than Gemini proper,
  # and their free-tier 16K tokens-per-minute cap is low enough that a full 8-screenshot
  # request can hit a per-minute limit on its own -- that is fine, since a per-minute 429
  # just cascades to the next model without retiring anything.
  #
  # --- Re-audit 2026-08-13 (live, against this account; re-runnable via
  #     `python tools/gemini_model_probe.py`) ---------------------------------------------
  # ALL SEVEN entries below were re-probed with the real request shape and all seven still
  # returned a valid opener on {"thinkingLevel": "minimal"}. Nothing was removed.
  #
  # gemini-2.5-pro JOINS the 404 list: like gemini-2.5-flash and gemini-2.5-flash-lite it is
  # still returned by ListModels with generateContent support, and still 404s NOT_FOUND on
  # every real call ("no longer available to new users"). The lesson above holds -- ListModels
  # is a catalog, not an entitlement -- so do not re-add any 2.5 id on the strength of it
  # being listed.
  #
  # gemini-3.7-flash remains in the cascade, but no longer leads it. It is the ONE entry here
  # admitted on inference rather than on a 200; read this before removing it entirely.
  # Measured 2026-08-13: version 3.7-flash-08-2026, generateContent + image + thinking:true,
  # and a free-tier quota of exactly 20 RPD (the 429 body carries quotaValue: 20 under
  # GenerateRequestsPerDayPerProjectPerModel-FreeTier) -- the same daily capacity as the other
  # Flash models. It WAS placed high on quality-descending order, as the most capable model this
  # account can reach.
  #
  # DEMOTED TO LAST IN ITS TIER 2026-08-28, on cost, not on quality. Live run 75e832ec6ad7 hit it
  # in slot 2 and it stalled to the full request_timeout_s of 90s (01:43:45 -> 01:45:16, a
  # transport read timeout, NOT a quota error -- the free-tier 20 RPD was untouched, 5 provider
  # calls all night). Combined with 2026-08-13's ~20 straight 503s, this project has still never
  # received a single 200 from it. Ordering it ahead of models that DO return openers therefore
  # buys nothing measurable and risks 90s of dead time in the opener path per profile. It stays
  # in the cascade -- if Google's capacity frees up it is still the best model here, and the
  # failure modes are all bounded/self-limiting (see below) -- but it now runs only after every
  # proven Flash entry has been tried.
  #
  # What is verified: it REJECTS {"thinkingLevel": "minimal"} with HTTP 400 INVALID_ARGUMENT,
  # "Thinking level MINIMAL is not supported for this model. Please retry with other thinking
  # level." That message is why its entry below is `low` and not a copy of the Gemma lines.
  # What is NOT verified: that `low` specifically is accepted. Every attempt at low/medium/high
  # (and thinkingBudget:0, and omitting thinkingConfig) returned 503 UNAVAILABLE "currently
  # experiencing high demand" -- launch-week load on a model published 08-2026 -- across ~20
  # attempts, until the 20 RPD was spent. Not one 200 was obtained on 2026-08-13.
  #
  # Why retaining it as a fallback is still safe, when shipping it would have been wrong that morning:
  # generate() used to RAISE every 400, so a wrong thinkingConfig aborted the whole opener call
  # and tripped OpenerService's 3-strike bad-request latch -- an unverified entry could kill a
  # run. That is fixed: a 400 naming the thinking config is now treated like a 404, retiring
  # only that model for the rest of the run (see _is_thinking_config_rejection and the
  # "thinking" scope in opener.py). So every remaining failure mode is bounded and self-
  # limiting:
  #   * wrong thinking level -> 400 -> retired for the run: ONE wasted request per RUN
  #   * id retired by Google -> 404 -> retired for the run: ONE wasted request per RUN
  #   * per-day quota gone   -> 429 -> retired for the run: ONE wasted request per RUN
  #   * 503 high demand      -> cascades WITHOUT retiring: one wasted request per PROFILE,
  #     but 503s still count against the 20 RPD, so it self-retires within a run rather than
  #     taxing it indefinitely.
  # 2026-08-24 LIVE RESULT: it returned 503 on both profiles, eleven days after the ~20/20 503
  # probe above. That satisfies the persistent-failure condition this note originally named.
  # The verified gemini-3.6-flash now leads, avoiding one failed request and ~8-16s of latency on
  # every ordinary profile. 3.7 sat immediately behind it as a bounded fallback until 2026-08-28,
  # when a live run showed that slot costing the full 90s request_timeout_s; it is now LAST in
  # this tier (see the demotion note above), still present rather than removed on availability
  # evidence alone.
  #
  # To confirm it (quota resets midnight Pacific):
  #   python tools/gemini_model_probe.py --models gemini-3.7-flash --include-configured --yes
  #
  # gemini-3.1-pro-preview: real and callable, but returned a per-DAY 429 on the very first
  # request, i.e. the free tier grants it no usable daily capacity. Not worth a cascade slot.
  #
  # The `gemini-flash-latest` / `gemini-flash-lite-latest` / `gemini-pro-latest` ALIASES are
  # moving pointers: the backing model can change without notice, and with it the thinking field
  # family -- which, per the note above, is a guaranteed 400 the day it moves. They were once
  # excluded outright for that reason; they are now CARRIED, but only at the bottom of their own
  # tier, as upgrade catchers (see the tier note above `models`) so a repointed alias is picked
  # up with no config change while every pinned, verified id is still tried first. That is why
  # this list keeps explicit versioned ids at the front, for the same reason preflight() exists.
  # gemini-3.1-flash-lite-preview ADDED 2026-08-13: probed live and it returned a clean,
  # filter-passing opener on {"thinkingLevel": "low"}. Worth noting because the published model
  # page lists it as SHUT DOWN and it plainly is not -- the same "docs lag the account" lesson
  # the 2.5 ids taught in the other direction. It is a separate model id from
  # gemini-3.1-flash-lite, so it carries its OWN per-model daily bucket rather than sharing that
  # model's -- real added capacity, not a second name for quota we already had. It is a preview
  # id and can be retired without notice, which is acceptable for exactly the reason
  # gemini-3-flash-preview above is: a 404 retires only that one entry for the rest of the run.
  # BEST-EFFORT CASCADE (2026-08-13): every id this account can reach that could plausibly
  # serve an opener is listed, quality-descending within tier. This is only safe because a
  # 400 naming the thinking config now retires just that model for the run (opener.py's
  # _is_thinking_config_rejection / "thinking" scope), exactly like a 404 -- so an entry that
  # turns out to be wrong costs ONE request per RUN, not a dead run. Retired entries are
  # skipped with no request from the second profile onward, so only the first profile of a run
  # ever pays the discovery cost.
  #   VERIFIED live at thinkingLevel:low -- 3.6-flash, 3.5-flash, 3-flash-preview,
  #     3.5-flash-lite, 3.1-flash-lite, 3.1-flash-lite-preview, gemini-flash-lite-latest.
  #   INFERRED (never returned a 200 on 2026-08-13, included on best effort) -- 3.7-flash
  #     (503 launch load, then its 20 RPD spent), the two 3.1-pro-preview ids and
  #     gemini-omni... see below, and gemini-flash-latest / gemini-pro-latest.
  # The *-latest ALIASES are included deliberately despite adding NO capacity: measured, they
  # resolve to the backing model's own quota bucket (gemini-flash-latest returned a per-day
  # 429 with zero requests ever sent to it, exhausted in lockstep with gemini-3.7-flash). They
  # earn their slot only as UPGRADE CATCHERS -- Google can repoint them at a newer model we do
  # not yet know about, and we would pick it up with no config change. They sit at the BOTTOM
  # of their tier so a pinned, VERIFIED id is always preferred over a moving pointer.
  #
  # ONE DELIBERATE EXCEPTION, 2026-08-28: gemini-3.7-flash is pinned but is the single entry here
  # that has never returned a 200 to this project, so "verified" does not apply to it and the
  # rule above does not either. It is placed behind even the aliases -- an alias that resolves to
  # something working beats an id measured never to work -- and ahead only of the lite/gemma
  # tiers, which are quality fallbacks rather than upgrade catchers.
  # gemini-omni-flash-preview is the one reachable id deliberately EXCLUDED: it is a
  # conversational VIDEO generation model, a different modality, not a text+image opener model.
  models: [gemini-3.6-flash, gemini-3.5-flash, gemini-3-flash-preview,
           gemini-3.1-pro-preview, gemini-3.1-pro-preview-customtools, gemini-pro-latest,
           gemini-flash-latest, gemini-3.7-flash,
           gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3.1-flash-lite-preview,
           gemini-flash-lite-latest,
           gemma-4-31b-it, gemma-4-26b-a4b-it]
  # Per-model generationConfig.thinkingConfig, passed through verbatim (see
  # GeminiOpener._payload). Thinking is ON BY DEFAULT for every model above, and thought
  # tokens are billed against max_tokens below -- an entry is REQUIRED for every model in
  # `models` (config.py's validate() enforces this) so nobody ships a model silently running
  # at its default (often "high") thinking level, which can burn the whole token budget and
  # return no opener text at all. All seven models below are on the family that uses
  # thinkingLevel (minimal/low/medium/high) rather than the older thinkingBudget (int; 0
  # disables) -- EMPIRICALLY VERIFIED: all seven accepted {"thinkingLevel": "minimal"} in a
  # live probe. Sending the wrong field name for a model's family is a guaranteed 400.
  #
  # --- minimal -> HIGH on the Gemini models, 2026-08-13, MEASURED --------------------------
  # `minimal` was never a quality choice; it was a token-budget defence (thought tokens are
  # billed against max_tokens below). ops/OPENER-REDESIGN.md treats it as a HANDICAP the design
  # then works around in three separate places -- the "I bet" entropy collapse (:169, "no
  # scratchpad for the model to reconsider its lead-in"), the field-order problem (:213), and
  # the whole referenced/angle/opener schema reorder (:446, "specifically because thinkingLevel:
  # minimal leaves the model no other scratchpad"). On the free tier the trade is backwards:
  # REQUESTS/day are scarce and tokens are free, and every opener the rejection filters throw
  # out costs a whole additional billed request (max_attempts below re-asks the SAME model).
  #
  # Measured thought tokens per request, one draw each, out of the 2048 max_tokens budget:
  #   model                     minimal   low     medium
  #   gemini-3.6-flash             --      719      --
  #   gemini-3.5-flash             --      479      --
  #   gemini-3-flash-preview       --        0      --
  #   gemini-3.5-flash-lite         0        0     1756  <- 91% of budget
  #   gemini-3.1-flash-lite         0      119      812
  # ...and at `high` (one draw each, the level actually shipped):
  #   gemini-3.5-flash-lite      1412 @2048 (STOP, ok)     1714 @16384
  #   gemini-3.1-flash-lite      1962 @2048 -> MAX_TOKENS  2778 @16384 (STOP, ok)
  #
  # THE SHIPPED SETTING IS `high`, AND IT IS ONLY VALID BECAUSE max_tokens WAS RAISED TO 16384
  # IN THE SAME CHANGE. Read max_tokens' comment below before touching either. The one-line
  # version: at high with the old 2048 budget, gemini-3.1-flash-lite spent 1962 of 2048 tokens
  # thinking and the JSON came back severed mid-field ( ..."opener": "I ) -- a billed request
  # that produces nothing, then a retry, and max_attempts of those stops the run. Thought-token
  # spend is also NOT monotonic in the level (high drew 1412 where medium drew 1756 on the same
  # model), so no level can be assumed "small enough" for a tight budget; only real headroom is
  # safe. Owner decision: openers are the product and thinking consumes no additional REQUESTS
  # (the actually-scarce resource on this tier), so buy the most reasoning available and size
  # the budget to fit it, rather than rationing reasoning to protect a budget that costs $0.
  #
  # HONEST LIMIT OF THE EVIDENCE: every draw at every level -- minimal, low, medium, high --
  # passed this project's own filters (2 sentences, zero scaffolding markers, no dashes). No
  # measurement here shows `high` writes BETTER openers than `low`; what it shows is that high
  # is affordable once the budget fits it. The metric that would actually settle it is the
  # rejection rate across many profiles (each rejection costs a whole billed request), which
  # needs a far larger sample than was run. If openers regress or retries climb, `low` is the
  # known-good fallback and the measurements above are its justification.
  #
  # The two Gemma models stay at `minimal` deliberately, and it is NOT an oversight: their
  # binding free-tier constraint is the 16K TOKENS-PER-MINUTE cap noted above, not requests/day,
  # and thought tokens count against it. Spending thinking there buys a per-minute 429 on a
  # last-resort entry. Gemini proper is RPD-bound, so it is the tier where thinking is cheap.
  #
  # Forward compatibility, and the reason this is not merely a preference: gemini-3.7-flash
  # REJECTS `minimal` outright (HTTP 400, "Thinking level MINIMAL is not supported for this
  # model"). `low` is the one setting that works across the current six and the model queued to
  # join them, so this change also removes a migration that was going to be forced anyway.
  thinking:
    # `low`, never `minimal`: 3.7 rejects minimal outright (see the models comment above).
    gemini-3.7-flash:             { thinkingLevel: high }
    gemini-3.6-flash:             { thinkingLevel: high }
    gemini-3.5-flash:             { thinkingLevel: high }
    gemini-3-flash-preview:       { thinkingLevel: high }
    # Pro tier + aliases: `low` on the same reasoning as the Flash models. Unverified for
    # these five ids -- if any rejects it, that is a thinking-config 400 and the cascade
    # retires just that model for the run (see the models comment above).
    gemini-3.1-pro-preview:       { thinkingLevel: high }
    gemini-3.1-pro-preview-customtools: { thinkingLevel: high }
    gemini-pro-latest:            { thinkingLevel: high }
    gemini-flash-latest:          { thinkingLevel: high }
    gemini-flash-lite-latest:     { thinkingLevel: high }
    gemini-3.5-flash-lite:        { thinkingLevel: high }
    gemini-3.1-flash-lite:        { thinkingLevel: high }
    gemini-3.1-flash-lite-preview: { thinkingLevel: high }
    gemma-4-31b-it:               { thinkingLevel: minimal }
    gemma-4-26b-a4b-it:           { thinkingLevel: minimal }
  # Raised from 400: thought tokens share this same budget (see `thinking` above), and at
  # 400 a model can burn the entire budget thinking and return finishReason=MAX_TOKENS with
  # NO text at all -- a billed call and no opener, on every profile. Output tokens are free
  # on the Google free tier, so this headroom is nearly costless; the real constraint on
  # this tier is requests/day, not tokens/request.
  #
  # 2048 -> 16384, 2026-08-13, COUPLED TO thinkingLevel: high ABOVE. THESE TWO MUST MOVE
  # TOGETHER -- raising the thinking level without raising this is a MEASURED failure, not a
  # theoretical one. gemini-3.1-flash-lite at {"thinkingLevel": "high"} with max_tokens 2048
  # returned thoughts=1962 + candidates=71 = 2033 of 2048, finishReason=MAX_TOKENS, and the
  # response JSON was severed mid-field:  ..."opener": "I   <- truncated exactly there.
  # That is a billed request that yields NOTHING: _parse raises OpenerParseError, the service
  # re-asks, and max_attempts of those in a row stops the run. The identical request at 16384
  # completed cleanly (thoughts=2778, finishReason=STOP).
  #
  # Why 16384 specifically: measured high-thinking spend ranged 1412-2778 thought tokens on a
  # SMALL synthetic 3-image profile; a real 8-screenshot capture sends far more input and can
  # reason longer, so this leaves roughly 5x headroom over the worst observed draw. It is
  # comfortably under every configured model's own outputTokenLimit (65536 on all twelve Gemini
  # ids, 32768 on the two Gemma ones), so it can never itself become a 400. Output tokens are
  # $0 on this tier and thinking consumes no additional REQUESTS, so the only real costs are
  # latency (measured ~9-11s at high vs ~4-7s at low, well inside request_timeout_s below) and
  # per-minute token pressure -- which is exactly why the two Gemma entries stay at `minimal`.
  max_tokens: 16384
  # Owner rule (updated 2026-08-15): ordinary rejected AI output (bad/empty
  # opener, fails the style rules, etc.) is re-asked with a correction hint instead of being
  # sent as-is or swapped for a bare like. Free-tier REQUESTS/day are the scarce resource
  # here, not tokens (see max_tokens above), so spending up to 5 service/content attempts
  # re-asking is cheap insurance against wasting an entire profile on one bad draw. One such
  # attempt may issue multiple HTTP model requests while walking the configured fallback list;
  # max_attempts is NOT a transport-request cap. If all max_attempts fail,
  # something is systemically wrong (a broken prompt, a misbehaving model, ...) rather than
  # one unlucky generation, so the run stops instead of sending a like with no opener. The
  # narrow exception is a provider safety-policy block: AUTO already chose Like before asking
  # for an opener, so it preserves that decision without a comment rather than stopping over
  # profile content we do not control. The block is not retried or bypassed.
  # Accepted range is 1-15 (config.py's validate(), _MAX_ATTEMPTS_CEILING). Each service
  # attempt can consume one or more real HTTP model requests, including usage-bearing results
  # which may be billed/quota-consuming. After a model returns unusable content it is added to
  # this profile's failed_models set, so the NEXT retry is steered away from that model rather
  # than re-hitting it first. Retry/fallback work is bounded by max_attempts, the finite
  # configured model list, each request_timeout_s, and Stop checks between attempts/models.
  # 15 already triples this reference point; see config.py for the full arithmetic.
  max_attempts: 5
  # Seconds before a stalled provider API call is abandoned. MEASURED, not guessed: a real
  # 8 screenshot Hinge profile uploads several MB of inline image data and then waits on
  # generation, and 30s was not enough (a live test timed out mid request). A timeout is the
  # worst failure mode here because the call is abandoned rather than cascaded, so the
  # profile gets no opener at all; the bot is human paced anyway, so a generous ceiling costs
  # nothing on the happy path and only ever applies when something is genuinely stuck.
  # Accepted range is (0, 180] seconds (config.py's validate(), _MAX_REQUEST_TIMEOUT_S): this
  # is the only bound on how long ONE call can run, so an unbounded value here would defeat
  # opener.max_attempts' own ceiling above by letting a single stalled call hang a profile
  # indefinitely. 180s is 2x this measured 90s worst case.
  request_timeout_s: 90
  # The advisory (Observe-only) retry budget: the SAME budget as max_attempts above, only
  # shortened. In Observe the opener is an optional suggestion shown to a human, so the two
  # things that force Auto and Training to spend the full budget do not apply: nothing
  # irreversible depends on the suggestion, and a person is waiting for it, so every extra
  # attempt is dead time rather than background work. Training is deliberately NOT advisory:
  # it requires a complete typed opener before publishing its Like/Dislike checkpoint and uses
  # max_attempts above. Three advisory attempts give an unlucky Observe draw a second and third
  # chance without turning one profile into a long wait. Accepted range is 1-15 and it may never
  # exceed max_attempts above (config.py's validate(), _MAX_ATTEMPTS_CEILING); an advisory
  # attempt is billed exactly like an Auto/Training one, hence the identical ceiling.
  advisory_max_attempts: 3
  # Observe-only wall clock ceiling on those advisory retries, in seconds.
  # advisory_max_attempts bounds how MANY service attempts run, not how long their model
  # fallbacks take. The service passes this absolute monotonic deadline into Gemini: it is
  # checked before attempts and between fallback models, and each HTTP request timeout is capped
  # to the remaining time. A response arriving after the deadline is treated as a stale advisory
  # (its usage is still accounted) and no further model/attempt starts. In practice this means a
  # slow advisory ends with a graceful "no suggestion" while future profiles remain eligible.
  # Accepted range is (0, 300] seconds (config.py's validate(), _MAX_ADVISORY_DEADLINE_S); 300
  # is deliberately far past the point where waiting beats typing, so it is an outer bound on
  # typos rather than a value anyone should choose.
  advisory_deadline_s: 60.0
  # The owner-tunable voice and substance rules for the opener itself. opener.py's _SYSTEM
  # carries a near-duplicate copy of this same text, and the two are pinned by two SEPARATE
  # tests (tests/test_config_yaml_real.py against this file, tests/test_opener.py against
  # _SYSTEM). Editing one without the other hands the model two contradictory style guides in
  # a single request AND fails a test in a file nobody would think to look at, so change both
  # together. The duplication itself is known debt, recorded in ops/OPENER-REDESIGN.md 3.1.
  #
  # Rewritten 2026-08-11 per ops/OPENER-REDESIGN.md sections 2 and 3 (Part A). The previous
  # text asked only that the opener be "grounded in exactly ONE concrete detail", which does
  # not distinguish being GROUNDED IN a detail from NAMING it, so the model recited the detail
  # back into the message it sent. For illustration: under a photo of her in an outdoor sauna
  # at sunset, an opener reading "That view by the sauna during sunset looks relaxing, where
  # is this from?" is naming exactly what the photo already shows. The failure is not
  # hypothetical, only the wording above is illustrative: production openers have shown the
  # same shape, restating the model's own internal grounding note (the `referenced` field)
  # back into the visible message word for word.
  # She is looking at the photo while she reads the words, so describing it back reads as if
  # we think she cannot see it.
  #
  # The fix can be unconditional because the premise holds 100% of the time: on Hinge a
  # like-with-comment is ALWAYS displayed attached to the specific photo or prompt card it
  # was left on, and there is no delivery path where she reads the text without that item in
  # front of her. Hence the SHARED CONTEXT RULE below.
  #
  # Shortening alone would have produced a worse failure ("That looks fun, where is it?" is
  # sendable to any woman alive), so the replacement property is not brevity but falsifiability:
  # the opener must carry a claim that COULD BE WRONG. Description is unfalsifiable by
  # construction, which is exactly why it proves nothing -- a message that cannot be wrong
  # could have been written without looking. Anyone can see; the opener has to show we thought.
  #
  # One deliberate wording that looks like a mistake and is not. The guardrail says "the
  # sender" and "he" rather than "me": the rest of the prompt addresses the
  # model in the second person about a third-person man ("the opening message a man sends"), so
  # a first-person "me" would be ambiguous about whose history is being protected.
  #
  # Addendum 2026-08-11 (same day, later): a live dry run against a real profile produced 5/5
  # openers that all opened with "I bet", exactly the entropy-collapse risk doc 3.6 predicted.
  # Root cause was the HEDGE THE CLAIM line offering only two named forms here ("I'm going to
  # guess", "I bet", "I heard", "I'm assuming") and, worse, only TWO in opener.py's _SYSTEM ("a
  # hedge like I bet or I heard"), with "I bet" landing first in the sentence the model reads
  # right before it writes. Fixed by widening the named forms to seven, framing them explicitly
  # as illustrative rather than a menu (the same escape-clause pattern already used for the
  # five moves below), and adding a standalone VARY THE OPENING instruction. Both changes are
  # mirrored in opener.py's _SYSTEM so the two copies keep agreeing (doc 3.1). This does not
  # replace the deterministic entropy guard doc 3.6 describes as the eventual real fix; it is
  # the prompt-layer mitigation that was actually missing.
  #
  # Addendum 2026-08-12 (Part B, ops/OPENER-REDESIGN.md 5.1): the model now CHOOSES which item
  # to write about, and that choice is also the item that gets liked, so the style guide gained
  # three paragraphs (PICK THE ITEM YOURSELF, THE FAILURE TO AVOID, THE UNNUMBERED IMAGES ARE
  # CONTEXT). Nothing already here was edited at that time: the one rule, the guardrails,
  # VARY THE OPENING, the two sentence ceiling, the economy rule and the HARD RULEs stayed, and opener.py's _SYSTEM
  # carries a compressed copy of the same three paragraphs so the pair keeps agreeing (doc 3.1).
  #
  # The selection criterion is doc 5.1's: best ANGLE, not most striking photo. It is the same
  # premise/point distinction THE ONE RULE already makes, applied one step earlier -- the item
  # is only the premise, so choosing by how the item LOOKS optimises the half that never becomes
  # the message. Doc 5.1's own illustration ships verbatim in spirit ("a mediocre backpacking
  # shot that connects to her food prompt beats a great portrait with nothing to say about it")
  # because the tradeoff, not the preference, is what a model with a page of photos in front of
  # it gets wrong.
  #
  # The failure mode is named as a failure on purpose. Picking a striking item with nothing to
  # say about it is not a separate bug from over-description, it is the upstream CAUSE of it:
  # once the item is chosen and there is no claim available, description is the only material
  # left, and every wording rule in Part A can be obeyed right up to that point. Hence "the way
  # out is always to pick a different item", which is the only instruction that actually fixes
  # it at the stage it goes wrong.
  #
  # The context tier is described rather than merely permitted. Doc 5.3 confirms from a live
  # capture that Hinge's vitals block (age, job, school, city) carries no like heart, so it is
  # sent unnumbered and can never be chosen -- but doc 2.3 names combining two things she said in
  # different places as the strongest move precisely because it cannot be bluffed by anyone who
  # read a single card, and the vitals block is prime material for it. Telling the model only
  # "you may not pick it" would leave the strongest use of the strongest move unstated.
  #
  # Addendum 2026-08-12 (audit fix, "BUG 1" -- the observe prompt contradicted itself): the three
  # paragraphs the addendum above added (PICK THE ITEM YOURSELF, THE FAILURE TO AVOID, THE
  # UNNUMBERED IMAGES ARE CONTEXT) are GONE from this block, and are not moving to a parallel
  # conditional copy here either. Root cause: this whole `style:` block is sent, byte-for-byte,
  # as the user turn's STYLE GUIDE on EVERY request regardless of shape (see opener.py's
  # _text_part), so an unconditional "you choose the item" instruction here directly contradicts
  # the anchored closing paragraph _text_part appends for OBSERVE's request ("YOUR MESSAGE
  # ATTACHES TO THE PHOTO OR PROMPT IN THAT LAST IMAGE ... Write about that item only"), which
  # fires precisely when the item is NOT the model's choice -- the human already made it by
  # tapping that item's heart. Both instructions reached Gemini in the same anchored request,
  # confirmed live by building the real request via
  # GeminiOpener._text_part(profile, cfg.opener.style, anchored=True).
  #
  # opener.py's _SYSTEM carries the same selection criterion and does NOT have this problem,
  # because it is genuinely shape-aware: _ANCHOR_SYSTEM is only appended when the request is
  # anchored, and it explicitly overrides _SYSTEM's own "PICK THE ITEM YOURSELF" line ("THIS
  # OVERRIDES PICK THE ITEM YOURSELF ABOVE ... you do not choose one") before the model ever
  # writes. Rather than build a second, parallel override for THIS copy -- which would leave two
  # independently-maintained shape-aware mechanisms doing the same job, and doc 3.1 already names
  # "the duplication trap" as the standing risk that produced this very bug -- the selection
  # criterion is deleted from here and left to live in exactly one place. _SYSTEM's version is
  # compressed, not abridged: every property this block used to state (the tradeoff, the failure
  # mode, the context tier and why to use it) is still there in full, pinned by
  # tests/test_opener.py, so nothing the model needs to choose well is lost -- only the
  # unconditional, unguarded duplicate of it is. See that test and
  # tests/test_config_yaml_real.py's test_shipped_opener_style_does_not_ship_the_item_selection_rule
  # for the pinned shape of this decision.
  #
  # Addendum 2026-08-15: a live suggestion opened with "my money is on the French Alps", which
  # is a bare answer to an imaginary location question rather than a complete standalone claim.
  # The previous seven-form hedge list had replaced one salient template with seven templates;
  # calling them examples did not stop the model from treating them as recommended copy. The
  # list is now gone. HEDGE THE CLAIM states the semantic job and lets the model choose language
  # from the item and angle. SELF CONTAINED CLAIM adds the "for what?" test, and every optional
  # second beat now inherits the evidence boundary instead of being allowed to invent a new
  # expectation, outcome, or earlier conversation.
  #
  # Addendum 2026-08-16: a second beat could obey that boundary while logically wobbling away
  # from the first: guess X, then ask whether X, ask about not-X, or switch to a generic question
  # about the scene. PREMISE CONSISTENCY makes a question accept the claim as its working premise
  # and advance it.
  #
  # Addendum 2026-08-16 (prompt de-templating): all concrete opener copy, worked scenarios and
  # move menus were removed from the model-facing style guide. Even a labelled bad example gives
  # a minimal-thinking model salient language to imitate. The regressions remain concrete in
  # tests, while the production prompt now contains only semantic properties and failure types.
  #
  # Addendum 2026-08-16 (minimum invention): unconditional falsifiability overcorrected the
  # description problem. When an item offered no natural inference, it pressured the model to
  # invent a motive or circumstance just to satisfy the format. Claims are now optional. A
  # visible detail may be named as setup and fails only when description is the final payoff.
  # The prompt prefers the least speculative natural move and explicitly distinguishes obvious
  # playful hyperbole from a literal invented backstory.
  #
  # Addendum 2026-08-16 (photo headers): a photo's title, caption, or prompt can reverse the
  # ordinary reading of its pixels. Treat that text and the photo as one compound item, and make
  # the opener respect the meaning of both.
  #
  # Addendum 2026-08-17 (referent clarity): a live draft framed two people as the competitors,
  # then used a shorthand noun in the question that could instead mean either their drinks or
  # the photograph itself. Existing question coherence kept the question to one topic, and
  # premise consistency prevented contradiction, but neither required the question's subject to
  # resolve to the subject established by the setup. REFERENT CLARITY closes that narrow gap
  # without banning any word or shipping concrete opener copy for the model to imitate.
  #
  # Addendum 2026-08-17 (reply comfort): a technically coherent question can still make its
  # recipient choose between defending herself and diminishing herself. The opener should make
  # the most natural honest reply feel good to give. This names the conversational property, not
  # a stock wording or worked scenario, so it guides the choice of angle without teaching a
  # template.
  style: |
    Use the dating and conversational principles associated with Coach Corey Wayne's
    "How to Be a 3% Man", without copying his wording. Be a charming gentleman first:
    relaxed, confident, playful, genuinely curious, and direct without pressure. Carry the
    spirit of his 90/10 framework across the interaction: default to sincere interest and
    easy confidence, and reserve light teasing or cheeky humor for the occasional profile
    where it arises naturally. Do not force teasing into every opener.

    SHARED CONTEXT RULE: your message is displayed directly under the exact photo or prompt it
    attaches to. She is looking at that item while she reads your words. Write like two people
    looking at the same thing.

    PRIMARY ITEM RULE: when you choose a numbered item, it is the clear main subject of the
    referenced note, angle, and opener, including its header. The message must feel natural
    directly under that item, never like a reason to discuss another image. Your opener must
    justify why the selected item was liked: it supplies the reason, subject, or payoff. You may
    use explicit profile text or an unnumbered context image as supporting context only when it
    sharpens a connection back to the selected item. Do not let another image replace the
    selected item as the reason for the Like, subject, or payoff, point her away from it, or use
    context without an unmistakable selected item anchor.

    PHOTO HEADER RULE: any title, caption, or prompt printed with a photo is part of that same
    item and defines how the photo is meant to be read. Interpret the visible scene through that
    text before choosing an angle. The angle and opener must respect the combined meaning, never
    contradict, reverse, or ignore the header's framing.

    CONVERSATIONAL VALUE RULE: do more than label what she can already see. A visible detail may
    be named and may be the subject, premise, or setup. The opener fails only when its final
    conversational point is merely that description. Use the detail to add a perspective,
    grounded interpretation, playful framing, connection, or natural question. A message that
    could have been written without looking at her profile has failed, but the message does not
    have to contain a guess or a claim that could be wrong.

    CLAIMS ONLY WHEN NATURAL: a correctable inference is one available move, not a requirement.
    When no natural inference exists, prefer a grounded observation or specific question over a
    forced guess. If you make a claim, write the whole proposition rather than a shorthand answer
    to an imagined question or a bare option in an unstated guessing game. Choose the least
    speculative interpretation that remains natural under ordinary explanations of the scene.

    MINIMUM INVENTION: never invent a purpose, motive, cause, plan, sequence, action, route,
    effort, goal, or unseen circumstance merely to create a claim. Do not assign why she chose or
    did something unless her profile states it. Any literal premise must be plainly visible in
    the item or explicitly stated in her profile. Never use one invented fact as the premise for
    another. A setting or destination does not establish how she arrived, what effort it took,
    or whether she pursued a goal. A hedge does not rescue a far fetched premise. Never infer
    ownership, employment, a routine, a responsibility, or a relationship merely from proximity
    in one photo.

    SAFETY AND DIGNITY: never infer, tease, or pose a forced choice about self harm, suicide,
    death, injury, an accident, a dangerous stunt, or courage around danger. A bridge, height,
    water, travel scene, or recognized location is never evidence that she jumped or considered
    jumping. Mention a risky activity only when her profile explicitly states it, and then keep
    it matter of fact rather than sensational.

    TRACEABILITY TEST: for any inference, she should instantly see which visible or stated clue
    led to it. If the path from clue to inference needs an explanation, the inference is too
    remote. Choose the least speculative natural angle.

    PLAYFUL HYPERBOLE: unmistakably nonliteral exaggeration is allowed when its visible anchor is
    immediate. It adds playful framing; it does not license presenting an invented motive,
    circumstance, or event as literal fact.

    Make one clear, positive, profile specific bid and leave room for her reply.

    Derive the conversational move from the specific profile rather than choosing from a fixed
    taxonomy. When two separate parts of her profile create one natural angle, that connection
    is especially specific because it requires reading the whole page.

    A natural claim she can correct can be effective, but it is not mandatory. One specific,
    easy, positive question may be the whole message when that is the strongest natural angle.

    SETUP PAYOFF CONTINUITY: every visible detail you name must be necessary to, and used by, the
    conversational move. If removing a descriptive clause leaves the later point or question
    unchanged, cut it. QUESTION COHERENCE: ask one coherent thing at a time. An 'or' is allowed
    only for parallel, genuinely contrasting answers to that same underlying question, never to
    join unrelated dimensions. CASUAL OR PUNCTUATION: never put a comma immediately before 'or',
    even where formal grammar would allow one. Write it the way a person would text casually.

    REFERENT CLARITY: every pronoun, shorthand noun, and question subject must have one
    immediately obvious referent. Across two beats, keep the same referent unless the transition
    to a new one is explicit and immediately clear. Do not make the reader choose between
    different ordinary meanings of the same word.

    ROLE CONSISTENCY: if you give a visible subject a playful role or rank, preserve that role
    across every beat. Do not give the same subject an incompatible role later. If you mean a
    different subject, name it explicitly.

    REPLY COMFORT: make the most natural honest reply feel good to give. Invite her to share a
    preference, perspective, inspiration, or experience, not self justification. Never test her
    intelligence, sincerity, knowledge, effort, or whether a visible detail is genuine. Do not
    offer a forced choice whose honest answers make her defend, diminish, or embarrass herself.
    If a visible detail could have more than one explanation, respond to its visible effect or
    choose another angle rather than asking her to verify its status.

    PREMISE CONSISTENCY: if the first beat asserts or guesses X, the second beat must accept X as
    its working premise and move the conversation forward from it. Never ask whether X itself
    was true, restate X as a question, ask about the opposite of X, or abandon X for a generic
    question about the surrounding scene. A second beat may extend the angle with clearly
    nonliteral hyperbole, but it may not add a literal invented fact, motive, or backstory. If no
    coherent continuation exists, stop after the first beat. Questions should invite positive,
    fun conversation, not form an interview.

    HEDGE THE CLAIM, NEVER YOURSELF: when a claim is uncertain, express that uncertainty
    naturally in wording that fits the specific item. The goal is calibrated uncertainty, not a
    particular lead in. This is not a phrase menu: choose the construction from context, and
    never use a hedge as a substitute for the complete self contained claim. Being wrong is then
    part of the fun and she gets to be the expert. Never apologise for writing, never ask
    permission, never call your own question dumb.

    VARY THE OPENING: let the specific item and angle determine the wording and sentence shape.
    Do not rotate or recycle a fixed stock hedge. The same opening construction message after
    message reads as a template, not a person.

    GUESS THE WORLD, NOT HER IDENTITY: name a country, a region, a park, the way a well travelled
    friend would. Never a street, a neighbourhood, a hotel, a specific venue, or anywhere that
    could be where she lives. Never guess her employer, her school, or her age, and never
    identify anyone else in the photo. When a place comes from recognizing the image rather than
    from her profile text, clearly identify it as a visual inference before building on it. Do
    not state an inferred location as shared experience, and do not turn it into a generic
    compliment. You may know more than this. Do
    not show it.

    NEVER INVENT THE SENDER: you may not claim he has been somewhere, done something, or likes
    something. You do not know his history and he has to live with whatever you write.

    Any teasing must be clearly good natured and never belittling, arrogant, condescending, or
    mean. Mild innuendo is eligible only when her own profile clearly invites that playful tone;
    never force it. A brief greeting is optional but cannot substitute for profile specific
    substance. At most one authentic, specific compliment is allowed; never pile on flattery or
    seek approval. Do not act as if intimacy or romantic interest already exists. Keep the tone
    non needy and do not demand that she chase.

    APPLICATION RULE: TWO sentences is the absolute maximum. Within that ceiling, be as short as
    the angle allows: spend no word merely repeating what she can already see, and no word on
    padding, but never cut necessary setup or the conversational payoff. A second sentence may be one easy positive question
    or a direct low pressure invitation. Do not try to build a text relationship in the opener.
    HARD RULE: never use an em dash or any hyphen; use commas or periods instead and spell out
    hyphenated abbreviations.
    A terminal plain text smiley, :) is allowed only when it meaningfully makes an otherwise
    potentially misread playful or teasing line clearly good natured. Never add it by default.

# --- Cost control (see operation_love/costing.py) ---
budget:
  run_budget_usd: 5.00         # stop spending on openers past this, per run
  # day_budget_usd: 10.00      # optional: hard daily ceiling across all runs (queries store at startup)
  # There used to be an on_exhausted: stop | swipe_without_opener setting here. The owner
  # ruled out a configurable commentless-like fallback (2026-08-10), so
  # swipe_without_opener no longer exists as an option. The hard-coded provider-safety
  # exception above is not budget exhaustion and does not revive that broad setting.
  # Stopping remains the response once openers are exhausted or budget.run_budget_usd is
  # reached. See opener.max_attempts above for the setting that
  # replaced it: how many times a rejected AI response is re-asked before the run stops.
  # $ per 1,000,000 tokens, per model (used for client-side spend tracking).

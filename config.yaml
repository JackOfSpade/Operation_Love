# Operation Love v2 — configuration (no hardcoded paths/coords; everything lives here)

# Which platform to run. See operation_love/platforms.py for the registry.
#
# This used to list both apps and run them CONCURRENTLY, one worker each. That worked only
# while they used different resources (Bumble in a browser, Hinge on the phone). Bumble
# discontinued its web app in August 2026 and moved to Android, so both now contend for the
# one physical Pixel — and Android foregrounds a single app: `adb exec-out screencap`
# captures whatever is on top, and the virtual touchscreen delivers to whatever holds focus.
# Two app-based platforms therefore cannot run at once; the registry rejects the pairing and
# the supervisor takes an exclusive lock on the device serial. Run one, then the other.
#
#   hinge      — app-based, calibrated, the working path
#   bumble     — app-based, NOT calibrated yet (placeholder coords; refuses to start)
#   bumble_web — web-based, no live target since Bumble web shut down (refuses to start)
enabled_apps: [hinge]

# observe = YOU swipe manually on real profiles; the bot learns your taste live
#           (no autonomous swiping). Start here to seed the ranker.
# auto    = the bot swipes for you using the model it learned.
mode: observe               # observe | auto  (override per app under apps.<app>.mode)

# Per-app options (headless toggle, login profile, DOM selectors to verify live).
apps:
  bumble:
    # ⚠️ UNCALIBRATED Android target (Pixel over host-side ADB, same as Hinge below). Bumble
    # discontinued its web app in August 2026 (see operation_love/platforms.py), so this is
    # becoming a second Android app on the same phone. Nobody has run this against the real
    # Bumble Android app yet: every coordinate here is a PLACEHOLDER GUESS, not a measurement.
    # `calibrated=False` on BUMBLE_SPEC (operation_love/drivers/android/bumble.py) is what
    # stops this actually running until it's verified live — do not treat any value below as
    # trustworthy in the meantime.
    serial: "33111JEHN04475"    # same physical Pixel as Hinge; fill in adb_path below if adb isn't on PATH
    adb_path: adb
    touch_backend: auto
    package: com.bumble.app
    debug_log: true
    debug_dir: ./data/bumble_android_debug   # deliberately distinct from bumble_web's debug_dir below
    halt_on_error: true
    coords:                     # PLACEHOLDER GUESSES ONLY — see BUMBLE_SPEC's module docstring
      # Bumble decides by DRAGGING the card, not by tapping the button row: its paid
      # SuperSwipe sits between Pass and Like with no confirmation modal, so a drifted tap
      # could spend money. These three are the drag path (start mid-card, well above the
      # button row) and are what actually gets used. Calibrate these first.
      swipe_start: [0.50, 0.55]
      swipe_like_end: [0.92, 0.52]
      swipe_pass_end: [0.08, 0.52]
      # Button positions, used only if decide_gesture is ever switched to "tap". They must
      # stay outside BUMBLE_SPEC.forbidden_zones (the SuperSwipe no-go rect) or the driver
      # will refuse the tap.
      like_heart: [0.85, 0.90]
      pass_x: [0.15, 0.90]
  bumble_web:
    # Renamed from `bumble` (2026-08): Bumble discontinued its web app, so this transport has
    # no live target right now — see operation_love/platforms.py. Driver logic is kept as-is
    # (generalised, site-agnostic hardening) in case a future web-based platform can reuse it.
    # The Bumble ANDROID target now lives at apps.bumble above.
    headless: false         # false = real backgrounded window (lower bot-detection, keeps your cursor)
    user_data_dir: ./data/bumble_profile   # persists your manual login
    url: https://bumble.com/app
    browser_channel: chrome # drive the real Google Chrome binary (authentic WebGL/plugins/window.chrome); "" = bundled Chromium
    inpage_overlays: false  # don't inject our status HUD into Bumble's DOM (lower footprint); status shows in the hub
    debug_log: true         # silent debug log: data/bumble_debug/<run>/ = actions.jsonl + a page screenshot on failure
    debug_dir: ./data/bumble_debug
    selectors:              # live-verified on Bumble web (2026-06); override here if the DOM drifts
      photo: 'img.media-box__picture-image, [data-qa-role="encounters-story-profile-image"] img'
      bio: '[data-qa-role="encounters-user"]'   # whole-card text (Bumble has no isolated "about" hook)
      prompt: '[data-qa-role="pill"]'           # structured attribute pills (height, drinking, …)
      # like/pass confirmed live = code defaults; superlike is observe-only (bot never super-swipes)
  hinge:
    # Physical Pixel over HOST-SIDE ADB only — no uiautomator2 / on-device helper
    # (ops/HINGE-PIXEL-RUNBOOK.md). Taps/swipes are humanized motionevent gestures.
    serial: "33111JEHN04475"  # adb device serial (Pixel 7a); empty = first available. `adb devices`
    adb_path: adb           # path to the adb binary
    # auto | uhid = REQUIRE the genuine UHID touchscreen (variable pressure, real FINGER
    # events); the run fails loudly if it is unavailable rather than quietly downgrading.
    # adb = deliberately accept the degraded input transport (humanized paths, but constant
    # pressure). There is no silent fallback: choosing the weaker signature is an explicit act.
    touch_backend: auto
    scroll_captures: 8      # max screencaps while reading one profile
    dwell_s: 1.1            # per-card read dwell, humanized (Signals #1: read before deciding)
    read_scroll_frac: 0.55  # how far each read-scroll advances the profile
    change_threshold: 9.0   # mean grayscale delta (0..255, 24x24) to call a frame region "changed"
    debug_log: true         # host debug log: data/hinge_debug/<run>/ = actions.jsonl + before/after screenshots
    debug_dir: ./data/hinge_debug
    halt_on_error: true     # auto mode STOPS on any unexpected error (no restart) so debug logs are preserved
    # Action points as FRACTIONS of the screen (x, y in 0..1). Calibrated live on the Pixel 7a
    # (1080x2400) 2026-06-27. like_heart / pass_x are located by VISION at runtime (template-
    # matching the glyph) because the "Start sending likes" banner + per-profile photo heights
    # shift the heart, and the X's disc merges into white prompt backgrounds; these fractions
    # are only the FALLBACK used when vision can't find the glyph. comment_box / send_like are
    # fixed (the like-sheet layout is consistent); send_like is kept clear of the 🌷Rose button.
    coords:
      like_heart: [0.868, 0.667]  # FALLBACK only — heart is vision-located on the first photo
      pass_x: [0.116, 0.848]      # FALLBACK only — X is vision-located (floating, bottom-left)
      comment_box: [0.500, 0.529] # comment field in the like sheet (calibrated)
      send_like: [0.643, 0.576]   # "Send Like" button in the like sheet (calibrated; clear of Rose)

paths:
  data_dir: ./data
  db_file: ./data/operation_love.db        # used only when storage.backend = sqlite

# --- Storage (system-of-record) ---
storage:
  backend: bigquery            # bigquery | sqlite
  bigquery:
    project_id: operation-love-2026   # dedicated GCP project (billing-linked; BQ API on)
    dataset: operation_love
    location: US
    photo_bucket: operation-love-2026-profile-photos
    flush_every: 5             # buffer N rows before streaming to BigQuery (low = less seed data lost on a crash/kill)

# --- Decision engine (local, learns YOUR taste from YOUR swipes) ---
ranker:
  like_threshold: 0.5          # P(like) above which we like
  min_labels_to_engage: 40     # ranker stays "not ready" until this many labels (needs both like+pass)
  retrain_every: 1             # observe mode: retrain live after each new label
  min_per_class: 5             # each class (like/pass) needs at least this many examples to train

quality_filter:
  enabled: true
  metric: clipiqa              # pyiqa metric; drops blurry/low-quality photos
  min_score: 0.30

# --- Opener (Claude) ---
opener:
  enabled: true
  model: claude-opus-4-8       # best quality; swap to claude-sonnet-4-6 for ~1.7x lower cost, or claude-haiku-4-5 for ~5x lower cost
  max_tokens: 400
  request_timeout_s: 30        # seconds before a stalled Claude API call is abandoned
  style: |
    Use the dating and conversational principles associated with Coach Corey Wayne's
    "How to Be a 3% Man", without copying his wording. Be a charming gentleman first:
    relaxed, confident, playful, genuinely curious, and direct without pressure. Carry the
    spirit of his 90/10 framework across the interaction: default to sincere interest and
    easy confidence, and reserve light teasing or cheeky humor for the occasional profile
    where it arises naturally. Do not force teasing into every opener. Ground this opener
    in exactly ONE concrete detail from a specific photo or prompt. Make one clear, positive,
    profile specific bid, then leave room for her reply. Favor a sincere observation, a direct
    low pressure invitation, or one open, easy to answer question about that detail. Questions
    should invite positive, fun conversation, not form an interview. Any teasing must be clearly
    good natured and never belittling, arrogant, condescending, or mean. Mild innuendo is eligible
    only when her own profile clearly invites that playful tone; never force it. A brief greeting
    is optional but cannot substitute for profile specific substance. At most one authentic,
    specific compliment is allowed; never pile on flattery or seek approval. Do not act as if
    intimacy or romantic interest already exists. Keep the tone non needy and do not demand that
    she chase. APPLICATION RULE: ONE short sentence is preferred and TWO sentences is the absolute
    maximum. A second sentence may be one easy positive question or a direct low pressure invitation.
    Do not try to build a text relationship in the opener.
    HARD RULE: never use an em dash or any hyphen; use commas or periods instead
    (write "physician assistant", not "PA-C").

# --- Cost control (see operation_love/costing.py) ---
budget:
  run_budget_usd: 5.00         # stop spending on openers past this, per run
  # day_budget_usd: 10.00      # optional: hard daily ceiling across all runs (queries store at startup)
  on_exhausted: stop           # stop | swipe_without_opener
  # $ per 1,000,000 tokens, per model (used for client-side spend tracking)
  pricing:
    claude-opus-4-8:   { input: 5.0, output: 25.0, cache_read: 0.50, cache_write: 6.25 }
    claude-sonnet-4-6: { input: 3.0, output: 15.0, cache_read: 0.30, cache_write: 3.75 }
    claude-haiku-4-5:  { input: 1.0, output: 5.0,  cache_read: 0.10, cache_write: 1.25 }

# --- Human-like pacing (log-normal spread around the anchor; see human.py) ---
pacing:
  swipe_delay_s: 3.5      # typical pause between swipes (sometimes shorter/longer, organic tail)

# --- Auto-mode volume (deliberately uncapped) ---
# A fixed numeric ceiling (e.g. "30 swipes, then stop") is itself a bot signature: run
# after run hitting the identical wall shows up as a hard step function under
# distribution analysis, which no human session boundary produces. Volume is instead
# governed by the ranker's own decisions, and is deliberately not replaced by another
# fixed stopping rule. Pacing and session micro-breaks shape the
# timing; a run continues until the profile queue runs out, a real error/deferral occurs,
# or it's stopped manually. Per-app overrides remain available
# under apps.<app>.limits (RateLimiter treats every field as optional; None = no cap)
# for cases where a temporary cap is genuinely wanted (e.g. a supervised test run),
# but none are set by default.
limits: {}

    gemini-3-flash-preview: { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }
    gemini-3.5-flash-lite:  { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }
    gemini-3.1-flash-lite:  { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }
    gemini-3.1-flash-lite-preview: { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }
    gemini-3.1-pro-preview: { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }
    gemini-3.1-pro-preview-customtools: { input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0 }

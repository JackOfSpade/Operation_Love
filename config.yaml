# Operation Love v2 — configuration (no hardcoded paths/coords; everything lives here)

# One process runs ALL of these concurrently (each as its own worker).
enabled_apps: [bumble]      # e.g. [bumble, hinge]

# observe = YOU swipe manually on real profiles; the bot learns your taste live
#           (no autonomous swiping). Start here to seed the ranker.
# auto    = the bot swipes for you using the model it learned.
mode: observe               # observe | auto  (override per app under apps.<app>.mode)

# Per-app options (headless toggle, login profile, DOM selectors to verify live).
apps:
  bumble:
    headless: false         # false = real backgrounded window (lower bot-detection, keeps your cursor)
    user_data_dir: ./data/bumble_profile   # persists your manual login
    url: https://bumble.com/app
    browser_channel: chrome # drive the real Google Chrome binary (authentic WebGL/plugins/window.chrome); "" = bundled Chromium
    inpage_overlays: false  # don't inject our status HUD into Bumble's DOM (lower footprint); status shows in the hub
    selectors:              # live-verified on Bumble web (2026-06); override here if the DOM drifts
      photo: 'img.media-box__picture-image, [data-qa-role="encounters-story-profile-image"] img'
      bio: '[data-qa-role="encounters-user"]'   # whole-card text (Bumble has no isolated "about" hook)
      prompt: '[data-qa-role="pill"]'           # structured attribute pills (height, drinking, …)
      # like/pass confirmed live = code defaults; superlike is observe-only (bot never super-swipes)
  hinge:
    # Phase 5: Android emulator over ADB (uiautomator2)
    serial: ""              # adb device/emulator serial; empty = first available

paths:
  data_dir: ./data
  db_file: ./data/operation_love.db        # used only when storage.backend = sqlite

# --- Storage (system-of-record) ---
storage:
  backend: bigquery            # bigquery | sqlite
  bigquery:
    project_id: operation-love-2026   # dedicated GCP project (billing-linked; BQ API on)
    dataset: operation_love
    location: US
    photo_bucket: operation-love-2026-profile-photos
    flush_every: 5             # buffer N rows before streaming to BigQuery (low = less seed data lost on a crash/kill)

# --- Decision engine (local, learns YOUR taste from YOUR swipes) ---
ranker:
  embedders: [arcface, clip]   # concatenate facial-structure + style/vibe vectors
  like_threshold: 0.5          # P(like) above which we like
  min_labels_to_engage: 40     # ranker stays "not ready" until this many labels (needs both like+pass)
  retrain_every: 1             # observe mode: retrain live after each new label

quality_filter:
  enabled: true
  metric: clipiqa              # pyiqa metric; drops blurry/low-quality photos
  min_score: 0.30

# --- Opener (Claude) ---
opener:
  enabled: true
  provider: anthropic
  model: claude-opus-4-8       # best quality; swap to claude-sonnet-4-6 for ~5x lower cost
  max_tokens: 400
  style: |
    Warm, specific, lightly playful. Reference ONE concrete detail from her
    profile (a photo or a prompt answer). One or two sentences. No greeting
    preamble ("Hey", "Hi there"), no pet names, no generic questions.

# --- Cost control (see operation_love/costing.py) ---
budget:
  run_budget_usd: 5.00         # stop spending on openers past this, per run
  on_exhausted: stop           # stop | swipe_without_opener
  # $ per 1,000,000 tokens, per model (used for client-side spend tracking)
  pricing:
    claude-opus-4-8:   { input: 5.0, output: 25.0, cache_read: 0.50, cache_write: 6.25 }
    claude-sonnet-4-6: { input: 3.0, output: 15.0, cache_read: 0.30, cache_write: 3.75 }
    claude-haiku-4-5:  { input: 1.0, output: 5.0,  cache_read: 0.10, cache_write: 1.25 }

# --- Human-like pacing (log-normal spread around the anchor; see human.py) ---
pacing:
  swipe_delay_s: 3.5      # typical pause between swipes (sometimes shorter/longer, organic tail)

# --- Auto-mode safety caps (observe mode = your manual swipes, never capped) ---
# Conservative, human-scale defaults (see the Bumble/Hinge anti-bot reviews): high
# volume + a high right-swipe ratio is the most reliable bot signal. Override per
# app under apps.<app>.limits.
limits:
  max_per_run: 30          # total swipes per app, per run (hub can override per-run in auto mode)
  max_per_day: 50          # total swipes per app, per day
  max_likes_per_run: 15    # cap RIGHT-swipes per run (keeps like:pass ratio human); run stops when hit

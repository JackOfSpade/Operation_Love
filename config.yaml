  #
  # THE MISSING PROPERTY. Every rule here governs what the message SAYS. None governed WHOSE
  # KNOWLEDGE it presumes. SHE IS THE ONE WHO KNOWS states it: the shared looking covers the item
  # on the screen, never the world behind it, so an inference about a place she went or a thing
  # she did is news to the sender and old news to her. It forbids asking her to agree about how
  # something appears and closing a claim about her own life with a tag that only collects her
  # agreement; it keeps asking her outright legal, because that is a real question from someone
  # who genuinely does not know. It is written as a NARROWING of SHARED CONTEXT RULE and a
  # SHARPENING of HEDGE THE CLAIM (put the uncertainty in how sure you are, never in how clear
  # the item is), and it defers to NEVER INVENT THE SENDER so it cannot be satisfied by claiming
  # where he has or has not been. VISUAL LOCATION TURN BOUNDARY keeps its whole SCOPE and loses
  # only its tilt: "the confirmation is the conversational payoff" becomes "her settling it is the
  # whole payoff either way", which still tells the model the message is complete (deleting that
  # assurance would re-create the 2026-09-05 bug of appending a second beat) without recommending
  # one of the two endings, and both endings are now explicitly subject to VARY THE SHAPE.
  #
  # MEASURED, AND IT CHANGED THE DECISION. 234 unique openers (124 local jsonl + 198 BigQuery, 88
  # overlapping), 2026-08-10 to 2026-09-14. The literal tag "right?" appears ONCE in 234, so a
  # lexical guard on it would have overfitted a single row, exactly the blocklist mistake the
  # 2026-09-06 NO GRADING addendum rejected. The real shape is a hedge plus an agreement-seeking
  # confirmation, and its vocabulary is already varied ("am I close?" x3, "how close is that
  # guess?", "is that where you were?", "right?"). Within the 21 proper-name location guesses it
  # went from 1 of 11 before 2026-09-05 to 5 of 10 after, and "am I close?" is 0 before and 3
  # after: the boundary rule collapsed the shape space of its own subpopulation. Both denominators
  # are small and a few rows move them a lot. NO DETERMINISTIC GUARD SHIPS, deliberately: the
  # existing _unconfirmed_location_followup_markers is a SCOPE guard (do not build on the guess)
  # and is left exactly as it is, including the bare-confirmation-tag shapes it accepts, because
  # widening it to the appearance frame would reject roughly 8 of those 21 including drafts that
  # read fine, at the cost of a run-stopping five-attempt budget. ESCALATION TRIGGER: if a watched
  # batch still asks her to co-sign an appearance, revisit a guard scoped to the appearance cue.
  # This is prompt-only in all FOUR on-wire copies (this block, _SYSTEM, the _SCHEMA opener and
  # angle descriptions, and the retry hint). The retry block gains the wording clause but NO new

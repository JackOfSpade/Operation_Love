[project]
name = "operation-love"
version = "2.0.0"
description = "Personal dating-app assistant: local preference ranker + configurable AI openers."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",    # load a local GEMINI_API_KEY from .env
]

[project.scripts]
operation-love = "operation_love.__main__:main"

[project.optional-dependencies]
# Local ML — embeddings, quality filter, ranker. Runs on Apple Silicon (MPS),
# NVIDIA (CUDA), or CPU. See operation_love/device.py.
ml = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "open_clip_torch>=2.24",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",     # insightface backend (CoreML/CPU on macOS)
    "pyiqa>=0.1.10",         # photo-quality pre-filter
    "pillow>=10.0",
    # pyiqa's "clipiqa" metric (the quality_filter.metric configured in config.yaml) hard-
    # requires the legacy `openai-clip` PyPI package (import name `clip`), whose clip/clip.py
    # does `from pkg_resources import packaging` at module import time -- not lazily -- when
    # pyiqa.create_metric("clipiqa", ...) is called from vision/quality.py's _ensure(). That
    # path is deliberately FAIL LOUD (warmup()/keep() re-raise; see quality.py), so once
    # pkg_resources is unimportable this aborts every real run instead of degrading quietly.
    # Verified empirically against PyPI's setuptools release history (2026-08-10): pkg_resources
    # still imports (with a deprecation warning) through setuptools 81.0.0, the LAST version
    # that has it, and is permanently gone starting 82.0.0 (released 2026-02-08, two days after
    # 81.0.0; still gone as of 84.0.0, the newest release at verification time). Pin below that
    # boundary so a real `pip install -e '.[ml,...]'` can never silently resolve a setuptools
    # that drops it out from under the quality filter. Do not remove this as unused cruft --
    # removing it reopens the crash the moment a bare/newer resolver is used.
    "setuptools<82",
]
# App drivers. Browser support is reference-only and deliberately not installed by launchers.
web = ["playwright>=1.44", "patchright>=1.44"]   # patchright = stealth-patched Playwright (no Runtime.enable CDP leak)
hinge = ["opencv-python>=4.8"]   # host-side ADB (needs `adb` CLI on PATH) + the `ml` extra (Pillow) for screencap diff; opencv template-matches the like/pass button glyphs
# Cloud storage (system-of-record + analytics)
bq = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.16"]
dev = [
    "pytest>=8.0",
    # The suite is dominated by a handful of tests that drive the real OpenCV pipeline over
    # full-resolution 1080x2400 synthetic frames, and cv2.matchTemplate inside
    # build_item_index/estimate_shift is most of that cost. Measured 2026-08-22: 60 of ~3800
    # tests were 61% of the wall clock -- that concentration has not been re-measured since, so
    # treat it as dated, not current. Re-measured 2026-09-02: 4549 tests collected (4544 passed
    # / 5 skipped), 259s wall clock under the default `-n auto`. There is nothing to delete --
    # the expensive tests are the high-fidelity ones -- so the suite is parallelised across
    # processes instead (see tests/conftest.py for why OpenCV is pinned to one thread per
    # worker, and [tool.pytest.ini_options] addopts for the default invocation).
    "pytest-xdist>=3.6",
    "ruff>=0.15,<0.16",
]

# Only install the library package in wheels. Setuptools keeps tests in the source
# distribution for downstream verification, while ops/, legacy/, and tools/ stay repo-only.
# (Without this, flat-layout auto-discovery errors on the extra top-level dirs. tools/ and
# tests/ stay importable via cwd from the repository root.)
[tool.setuptools.packages.find]
include = ["operation_love*"]

# Ship the Hinge button-glyph templates (vision-located like/pass) and the hub's
# HTML/CSS/JS page (kept in its own file for editor tooling) with the package.
[tool.setuptools.package-data]
operation_love = ["drivers/assets/*.png", "assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Run the suite across processes by default: measured 2026-08-22 on a 12-core Mac, 19m33s
# serial -> 2m50s with `-n auto`.  The count is not the reason it was slow -- 3761 of the 3821
# tests share 458s between them -- 60 tests are 61% of the wall clock, because they drive the
# real OpenCV pipeline (cv2.matchTemplate inside build_item_index / estimate_shift) over real
# 1080x2400 frames.  Those are the highest-fidelity tests in the repo, so they are parallelised
# rather than thinned.  `--dist loadgroup` distributes individual tests while still honouring
# `@pytest.mark.xdist_group` if a future test ever needs pinning; nothing needs it today (the
# hub's `_bind` already scans 200 ports and reads the bound one back, and tests/conftest.py's
# `_machine_global_state_is_never_the_operators` gives every worker its own lock root and temp
# directory).
#
# `-n0` turns it back off, and is what you want for `--pdb`, `-s`, or a readable single-test
# traceback: `pytest -n0 tests/test_hub.py -k some_test -s`.  This line requires pytest-xdist,
# which is why it is in the `dev` extra above; an environment without it fails with
# "unrecognized arguments: -n" rather than silently running serially.
addopts = ["-n", "auto", "--dist", "loadgroup"]

[tool.ruff]
target-version = "py311"
# These archived research implementations were imported from their upstream projects and are
# not part of the maintained package. Other first-party Python under legacy/ remains linted.
extend-exclude = [
    "legacy/beauty_and_BMI_analysis/ComboLoss",
    "legacy/beauty_and_BMI_analysis/face_to_bmi_vit",
]

[tool.ruff.lint]
# Make the established baseline explicit. Broader modernization/style rule sets
# can be adopted separately without turning a dependency upgrade into a surprise
# repository-wide rewrite.
select = ["E4", "E7", "E9", "F"]
# These focused checks catch silent truncation, unused loop bindings, late-bound closures,
# dynamic assignment of constant attributes, implicit subprocess failure semantics, and readable
# transformed-list/extrema simplifications without imposing a broader style migration.
extend-select = [
    "B007", "B010", "B023", "B905", "PERF401", "PLW1510", "PLW3301",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    # The isolated 88-module suite needs headroom for variable hosted-runner runtime.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch
        run: >
          pip install --quiet
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          torch torchvision
      - name: Install package and test dependencies
        run: pip install --quiet -e '.[dev,hinge,ml]'
      - name: Run tests
        run: python scripts/run_ci_test_files.py

  lint:
    name: ruff and prompt-era registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --quiet -e '.[dev]'
      - run: ruff check operation_love tests tools scripts
      - run: ruff format --check .
      - run: python tools/backfill_prompt_eras.py --check

  compatibility:
    name: Python 3.12 macOS package and launcher
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check supported runtime without model downloads
        run: |
          python -m pip install -e '.[dev,hinge]' build pillow
          python -m pytest -o addopts= tests/test_config.py tests/test_runtime.py tests/test_main_cli.py tests/test_launcher_smoke.py -q
          zsh -n "Operation Love.command"
          python -m build
      - name: Smoke installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/operation-love-installed"
          "$RUNNER_TEMP/operation-love-installed/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/operation-love-installed/bin/operation-love" --help

  required:
    name: CI required
    if: ${{ always() }}
    needs: ["test", "lint", "compatibility", "merge-policy"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
